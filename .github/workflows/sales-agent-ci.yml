name: sales-agent-ci

on:
  push:
    paths:
      - "sales-agent/**"
      - ".github/workflows/sales-agent-ci.yml"
  pull_request:
    paths:
      - "sales-agent/**"
      - ".github/workflows/sales-agent-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-agent
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sales-agent/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: vendedor doctor
      - run: ruff check .
      - run: python -m pytest -q --cov
      - run: vendedor demo
      - run: vendedor model-check
      - run: vendedor evaluate --output "${RUNNER_TEMP}/evaluation.json"

  distribution:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sales-agent/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: cd "${RUNNER_TEMP}" && vendedor doctor && vendedor demo

  shifted-clock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sales-agent/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --clock-shift-days=400

  reject-unsupported-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - name: Reject installation on Python 3.10
        run: |
          if python -m pip install --dry-run --no-deps . > "$RUNNER_TEMP/pip-unsupported.log" 2>&1; then
            echo "Installation unexpectedly succeeded on Python 3.10"
            exit 1
          fi
          grep -E 'requires a different Python|requires-python|requires Python' "$RUNNER_TEMP/pip-unsupported.log"
