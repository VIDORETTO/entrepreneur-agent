[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vendedor-adaptavel"
version = "0.1.0"
description = "Vendedor comercial local com estado explícito, políticas e evidências verificáveis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vendedor Adaptável contributors"}]
keywords = ["sales", "agent", "sqlite", "automation", "portuguese"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/VIDORETTO/entrepreneur-agent/tree/main/sales-agent"
Repository = "https://github.com/VIDORETTO/entrepreneur-agent"
Issues = "https://github.com/VIDORETTO/entrepreneur-agent/issues"
Changelog = "https://github.com/VIDORETTO/entrepreneur-agent/blob/main/sales-agent/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=7,<9",
  "pytest-cov>=5,<8",
  "build>=1,<2",
  "twine>=5,<7",
  "ruff>=0.12,<1",
  "jsonschema>=4,<5",
]

[project.scripts]
vendedor = "sales_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sales_agent = ["resources/*.json"]

[tool.setuptools.data-files]
"share/vendedor-adaptavel" = ["manifest.json", "LICENSE", "THIRD_PARTY_NOTICES.md"]
"share/vendedor-adaptavel/references" = ["references/conversation-contract.md", "references/question-policy.md", "references/evidence-policy.md"]
"share/vendedor-adaptavel/schemas" = ["schemas/business-package.schema.json", "schemas/channel-event.schema.json"]
"share/vendedor-adaptavel/skills" = ["skills/README.md", "skills/vendor-sources.md"]
"share/vendedor-adaptavel/skills/sales-setup" = ["skills/sales-setup/SKILL.md"]
"share/vendedor-adaptavel/skills/sales-business-discovery" = ["skills/sales-business-discovery/SKILL.md"]
"share/vendedor-adaptavel/skills/sales-knowledge-preparation" = ["skills/sales-knowledge-preparation/SKILL.md"]
"share/vendedor-adaptavel/skills/sales-knowledge-preparation/scripts" = ["skills/sales-knowledge-preparation/scripts/import_farol.py"]
"share/vendedor-adaptavel/skills/sales-simulate" = ["skills/sales-simulate/SKILL.md"]
"share/vendedor-adaptavel/skills/sales-simulate/scripts" = ["skills/sales-simulate/scripts/run_case.py"]
"share/vendedor-adaptavel/skills/seller-conversation" = ["skills/seller-conversation/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["sales_agent"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
